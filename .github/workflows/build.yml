name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # 官方插件模板的构建脚本：拉取 obs-deps 预编译依赖 + obs-studio 31.1.1 源码，
      # 编译 libobs（obs-frontend-api 目标），再用 find_package(libobs) 编译本插件，
      # 安装到 release/RelWithDebInfo/obs-pdf-presenter/{bin/64bit,data}
      - name: 编译插件 (obs-deps + obs-studio libobs)
        run: ./.github/scripts/Build-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      # 下载 PDFium 渲染引擎（运行时 dll，与插件 dll 同目录）
      - name: 注入 pdfium.dll
        run: |
          curl.exe -L --fail -sS -o pdfium.tgz `
            https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz
          if ($LASTEXITCODE -ne 0) { throw "pdfium 下载失败" }
          tar -xzf pdfium.tgz -C .
          $pdf = Get-ChildItem -Recurse -Filter 'pdfium.dll' | Select-Object -First 1
          if (-not $pdf) { throw "未找到 pdfium.dll" }
          $dest = "release/RelWithDebInfo/obs-pdf-presenter/bin/64bit"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item $pdf.FullName $dest
          Write-Output "pdfium.dll -> $dest"

      # 确认 PPT 转换脚本在包里
      - name: 校验插件包内容
        run: |
          Get-ChildItem release/RelWithDebInfo/obs-pdf-presenter -Recurse -File | ForEach-Object { $_.FullName }

      # 打 zip 包：release/obs-pdf-presenter-1.0.0-windows-x64.zip
      - name: 打包插件
        run: ./.github/scripts/Package-Windows.ps1 -Target x64 -Configuration RelWithDebInfo

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: obs-pdf-presenter-windows-x64
          path: release/obs-pdf-presenter-1.0.0-windows-x64.zip
          if-no-files-found: error
